name: Build and Push Docker Image (API Core)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api-core/**'
      - '.github/workflows/docker-api-core.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: quizsync.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          docker build -t quizsync.azurecr.io/api-core:${{ github.sha }} -t quizsync.azurecr.io/api-core:latest -f apps/api-core/Dockerfile .
          docker push quizsync.azurecr.io/api-core --all-tags
