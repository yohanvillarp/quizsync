name: CI/CD Pipeline - QuizSync

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  Integracion_Continua:
    name: Build & E2E Testing
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      # --- CONSTRUCCIÓN (BUILD) ---
      - name: Construir API Core
        run: |
          cd apps/api-core
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Construir Game Engine
        run: |
          cd apps/game-engine
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Construir Cliente
        run: |
          cd apps/cliente
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Construir Studio
        run: |
          cd apps/studio
          pnpm install --no-frozen-lockfile
          pnpm run build

      # --- INFRAESTRUCTURA EFÍMERA ---
      - name: Levantar Bases de Datos (Docker)
        run: docker compose -f docker-compose.yml up -d

      - name: Instalar Dependencias de QA y Utilidades
        run: |
          npm install -g wait-on
          cd apps/qa
          pnpm install --no-frozen-lockfile
          npx playwright install --with-deps

      - name: Levantar Servidores Locales
        # Ejecutamos en segundo plano y usamos nohup para asegurar que sigan corriendo
        run: |
          cd apps/api-core && pnpm run start:prod &
          cd apps/game-engine && pnpm run start:prod &
          cd apps/cliente && pnpm run preview --port 4173 &
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/quizsync?schema=public"
          REDIS_URL: "redis://localhost:6379"
          VITE_API_URL: "http://localhost:3000"
          VITE_ENGINE_URL: "http://localhost:3002"

      - name: Esperar a que los puertos respondan
        run: |
          wait-on tcp:3000 tcp:3002 tcp:4173 -t 60000

      # --- EJECUCIÓN DE PRUEBAS ---
      - name: Pruebas Funcionales E2E (Playwright)
        run: |
          cd apps/qa
          pnpm run test:e2e
        env:
          CLIENT_URL: "http://localhost:4173"

      - name: Pruebas de Carga (Artillery)
        run: |
          cd apps/qa
          pnpm run test:load
        env:
          TARGET_URL: "http://localhost:3002"

  SonarQube:
    name: Análisis de Calidad
    needs: Integracion_Continua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Escanear con SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  Reportes:
    name: Enviar a Google Sheets
    needs: [Integracion_Continua, SonarQube]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Lanzar Webhook
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{"commit": "${{ github.sha }}", "author": "${{ github.actor }}", "status": "${{ job.status }}"}' \
          ${{ secrets.GOOGLE_SCRIPT_WEBHOOK_URL }}
