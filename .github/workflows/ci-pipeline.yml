name: CI/CD Pipeline - QuizSync

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # ---------------------------------------------------------
  # 1. BUILD: Asegurar que todo compila correctamente
  # ---------------------------------------------------------
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install and Build API Core
        run: |
          cd apps/api-core
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Install and Build Game Engine
        run: |
          cd apps/game-engine
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Install and Build Cliente
        run: |
          cd apps/cliente
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Install and Build Studio
        run: |
          cd apps/studio
          pnpm install --no-frozen-lockfile
          pnpm run build

  # ---------------------------------------------------------
  # 2. TESTING: Ejecutar pruebas automatizadas en QA
  # ---------------------------------------------------------
  test:
    name: E2E & Load Testing
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install QA Dependencies
        run: |
          cd apps/qa
          pnpm install --no-frozen-lockfile

      - name: Install Playwright Browsers
        run: |
          cd apps/qa
          npx playwright install --with-deps

      - name: Run E2E Tests (Playwright)
        run: |
          cd apps/qa
          pnpm run test:e2e

      - name: Run Load Tests (Artillery)
        run: |
          cd apps/qa
          pnpm run test:load

  # ---------------------------------------------------------
  # 3. SONARQUBE: Análisis estático de código
  # ---------------------------------------------------------
  sonarcloud:
    name: SonarQube Analysis
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para el análisis preciso de SonarQube
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Necesario para crear comentarios en PRs
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # Creado en los secrets de GitHub

  # ---------------------------------------------------------
  # 4. REPORTES: Enviar resultados a Google Sheets (Webhook)
  # ---------------------------------------------------------
  report:
    name: Send Report to Google Sheets
    needs: [build, test, sonarcloud]
    if: always() # Ejecutar siempre, incluso si las pruebas fallaron
    runs-on: ubuntu-latest
    steps:
      - name: Call Webhook
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{"commit": "${{ github.sha }}", "author": "${{ github.actor }}", "status": "${{ job.status }}"}' \
          ${{ secrets.GOOGLE_SCRIPT_WEBHOOK_URL }}
