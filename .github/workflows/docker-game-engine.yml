name: Build and Push Docker Image (Game Engine)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/game-engine/**'
      - '.github/workflows/docker-game-engine.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: quizsync.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          docker build -t quizsync.azurecr.io/game-engine:${{ github.sha }} -t quizsync.azurecr.io/game-engine:latest apps/game-engine
          docker push quizsync.azurecr.io/game-engine --all-tags
